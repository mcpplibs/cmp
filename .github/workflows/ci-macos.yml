name: ci-macos

# macOS CI (Apple Silicon) — same flow as ci-linux.yml, on the LLVM toolchain
# mcpp resolves by default on macOS. Runner must be arm64: the mcpp package
# index ships macOS artifacts for aarch64 only.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep aligned with the Linux cold-cache floor.
  XLINGS_VERSION: v2026.8.27.5
  XLINGS_NON_INTERACTIVE: '1'

jobs:
  build-test:
    name: build + test (macos arm64)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xlings
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
            | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Install project tools (.xlings.json → mcpp)
        run: |
          xlings update
          xlings install -y
          mcpp --version

      - name: Qualify library
        run: |
          mcpp build --profile dev --strict --cache=off
          mcpp test --profile dev --strict --cache=off
          mcpp build --profile release --strict --cache=off
          mcpp test --profile release --strict --cache=off

      - name: Qualify example
        run: |
          cd examples/basic
          mcpp run
          mcpp build --profile release --strict --cache=off
