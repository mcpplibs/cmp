name: ci-windows

# Windows CI — same flow as ci-linux.yml. xlings bootstraps from PowerShell;
# everything after it runs in bash (git-bash ships on the runner), so the
# build/test/example steps stay byte-identical to the other two
# platforms instead of forking into a second dialect.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  # Both installers read this: the shell one takes it as an argument or an env
  # var, the PowerShell one defaults its -Version parameter to it. Keep this
  # aligned with the Linux cold-cache floor.
  XLINGS_VERSION: v2026.8.27.5
  XLINGS_NON_INTERACTIVE: '1'

jobs:
  build-test:
    name: build + test (windows x86_64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xlings
        shell: pwsh
        run: |
          irm https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.ps1 | iex

          $xlingsbin = "$env:USERPROFILE\.xlings\subos\current\bin"
          $env:PATH = "$xlingsbin;$env:PATH"
          $xlingsbin | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Install project tools (.xlings.json → mcpp)
        shell: pwsh
        run: |
          xlings update
          xlings install -y
          mcpp --version

      - name: Validate strict-mode degradation
        shell: bash
        run: |
          # mcpp 2026.8.28.1 的 Windows LLVM 后端暂不生成 depfile；只放行这一条已知降级。
          trap 'rm -f strict-mode.log' EXIT
          set +e
          mcpp build --profile dev --strict --cache=off --no-color > strict-mode.log 2>&1
          strict_status=$?
          set -e
          cat strict-mode.log
          if [ "$strict_status" -ne 0 ]; then
            test "$strict_status" -eq 1
            test "$(grep -Fc 'warning: this toolchain and platform combination emits no GNU depfile' strict-mode.log)" -eq 1
            test "$(grep -Fc 'error: 1 degradation(s) reported and --strict is set' strict-mode.log)" -eq 1
            test "$(grep -Ec '^(warning|error):' strict-mode.log)" -eq 2
          fi

      - name: Qualify library
        shell: bash
        run: |
          mcpp build --profile dev --cache=off
          mcpp test --profile dev --cache=off
          mcpp build --profile release --cache=off
          mcpp test --profile release --cache=off

      - name: Qualify example
        shell: bash
        run: |
          cd examples/basic
          mcpp run
          mcpp build --profile release --cache=off
